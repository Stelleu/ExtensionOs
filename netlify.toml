# Netlify configuration.
#
# The build command and publish directory are managed in the Netlify UI; this
# file only adds settings that need to live alongside the code.

[build.environment]
  # Keys listed here are intentionally public or non-secret, but Netlify's
  # secrets scanner still fails the build when their values appear in
  # compiled Next.js chunks (expected for NEXT_PUBLIC_* vars).
  #
  # RESEND_FROM_EMAIL: From address is public by design; also collides with
  # form placeholders in the UI.
  #
  # NEXT_PUBLIC_*: These must ship to the browser / SSR bundles — that is
  # what the NEXT_PUBLIC_ prefix means. They are not server secrets.
  SECRETS_SCAN_OMIT_KEYS = "RESEND_FROM_EMAIL,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
